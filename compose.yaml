services:
  mysql:
    image: mysql:8.4
    ports:
      - '127.0.0.1:${MYSQL_PORT:-3308}:3306'
    environment:
      MYSQL_DATABASE: code_battle
      MYSQL_USER: isard
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost --silent']
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql_data:
